name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the toolchain and the shells
        run: pacman -Syu --noconfirm --needed rust bash zsh fish git groff
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (the completions parse in bash, zsh and fish)
        run: PAKU_REQUIRE_SHELLS=1 cargo test
      - name: Man page
        run: |
          warnings=$(groff -man -ww -z paku.1 2>&1)
          [ -z "$warnings" ] || { echo "$warnings"; exit 1; }
